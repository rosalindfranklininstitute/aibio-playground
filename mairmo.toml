[snippets]
include_default_snippets = true
custom_paths = []

[display]
cell_output = "below"
reference_highlighting = true
default_table_max_columns = 50
default_width = "medium"
default_table_page_size = 10
code_editor_font_size = 14
theme = "light"
dataframes = "rich"

[formatting]
line_length = 79

[package_management]
manager = "pip"

[mcp]
presets = []

[mcp.mcpServers]

[server]
browser = "default"
follow_symlink = false

[ai]
rules = ""
inline_tooltip = false
mode = "manual"

[ai.custom_providers]

[ai.models]
chat_model = "ollama/gemma4:26b"
autocomplete_model = "ollama/gemma4:26b"
edit_model = "ollama/gemma4:26b"
displayed_models = []
custom_models = []

[ai.ollama]
base_url = "http://ollama:11434/v1"

[save]
autosave_delay = 1000
format_on_save = false
autosave = "after_delay"

[keymap]
preset = "default"

[keymap.overrides]

[diagnostics]
sql_linter = true

[runtime]
default_csv_encoding = "utf-8"
auto_reload = "off"
default_sql_output = "auto"
watcher_on_save = "lazy"
on_cell_change = "autorun"
reactive_tests = true
std_stream_max_bytes = 1000000
show_tracebacks = false
output_max_bytes = 8000000
auto_instantiate = false

[completion]
copilot = false
signature_hint_on_typing = false
activate_on_typing = true

[language_servers.pylsp]
enable_pydocstyle = false
enabled = false
enable_mypy = true
enable_pyflakes = false
enable_pylint = false
enable_ruff = true
enable_flake8 = false
