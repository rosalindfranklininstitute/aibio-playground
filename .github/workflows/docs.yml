name: Deploy docs

on:
  push:
    branches: [docs]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
    workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs image
        run: docker build -t aibio-playground-docs ./docs

      - name: Build site
        run: docker run --rm -v ${{ github.workspace }}:/docs aibio-playground-docs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/docs'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
